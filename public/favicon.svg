<svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <defs>
    <linearGradient id="stageGradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#1a1a2e;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0f0f1e;stop-opacity:1" />
    </linearGradient>
    <radialGradient id="spotlightGradient" cx="50%" cy="20%">
      <stop offset="0%" style="stop-color:#3b82f6;stop-opacity:0.8" />
      <stop offset="70%" style="stop-color:#3b82f6;stop-opacity:0.3" />
      <stop offset="100%" style="stop-color:#3b82f6;stop-opacity:0" />
    </radialGradient>
  </defs>
  
  <!-- Background circle -->
  <circle cx="50" cy="50" r="50" fill="url(#stageGradient)"/>
  
  <!-- Spotlight beam (cone shape) -->
  <defs>
    <filter id="glow">
      <feGaussianBlur stdDeviation="2" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  
  <!-- Spotlight cone (triangle pointing down) -->
  <polygon points="50,15 25,65 75,65" fill="url(#spotlightGradient)" opacity="0.7" filter="url(#glow)"/>
  
  <!-- Stage platform -->
  <rect x="20" y="68" width="60" height="8" fill="#3b82f6" rx="1"/>
  
  <!-- Stage outline/border -->
  <rect x="20" y="68" width="60" height="8" fill="none" stroke="#2563eb" stroke-width="1.5" rx="1"/>
  
  <!-- Spotlight source (small circle at top) -->
  <circle cx="50" cy="12" r="3" fill="#3b82f6" filter="url(#glow)"/>
  
  <!-- Accent circles for depth -->
  <circle cx="50" cy="12" r="4" fill="none" stroke="#60a5fa" stroke-width="1" opacity="0.6"/>
</svg>