name: Component catalogue

on:
  pull_request:
    types: [opened, synchronize, reopened, labeled]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: component-catalogue-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Check catalogue
    if: github.event_name == 'workflow_dispatch' || contains(github.event.pull_request.labels.*.name, 'architecture-track-gate') || contains(github.event.pull_request.labels.*.name, 'screen-refinement-gate')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check component catalogue
        run: npm run catalogue:check

      - name: Enforce reviewed workbench baseline
        run: npm run catalogue:baseline

      # Keep prospective policy findings visible before the blocking regression gate.
      - name: Warn about design-system governance regressions
        run: npm run design-system:warn -- --base "${{ github.event.pull_request.base.sha || github.event.before || 'origin/main' }}"

      - name: Enforce new design-system regressions only
        run: npm run design-system:check -- --base "${{ github.event.pull_request.base.sha || github.event.before || 'origin/main' }}"
