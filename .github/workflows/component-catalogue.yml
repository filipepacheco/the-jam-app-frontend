name: Component catalogue

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: component-catalogue-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Check catalogue
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check component catalogue
        run: npm run catalogue:check

      - name: Enforce reviewed workbench baseline
        run: npm run catalogue:baseline
