name: Private component workbench

on:
  pull_request:
  push:
    branches:
      - main
      - codex/private-visual-regression-61

permissions:
  contents: write

concurrency:
  group: private-workbench-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Test and build privately
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/playwright:v1.55.1-noble
      options: --ipc=host
    env:
      PRIVATE_VISUAL_RENDERER: playwright-v1.55.1-noble
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      # One-time bootstrap for PR #99. Removed immediately after the canonical
      # Linux references are committed by this exact same-repository branch.
      - name: Bootstrap canonical Linux visual baselines
        if: github.event_name == 'push' && github.ref == 'refs/heads/codex/private-visual-regression-61'
        env:
          VISUAL_BASELINE_REASON: "Issue #99: generate references in the pinned Linux renderer"
          VISUAL_BASELINE_REVIEWER: "Codex CI bootstrap approved by repository owner"
        run: npm run visual:update

      - name: Commit canonical Linux visual baselines
        if: github.event_name == 'push' && github.ref == 'refs/heads/codex/private-visual-regression-61'
        run: |
          git config user.name github-actions
          git config user.email github-actions@github.com
          git add private-visual-baselines docs/design-system
          git commit -m "fix: regenerate visuals in canonical Linux renderer [skip ci]"
          git push

      - name: Run workbench browser tests
        if: github.event_name != 'push' || github.ref != 'refs/heads/codex/private-visual-regression-61'
        run: npm run workbench:test

      - name: Enforce private visual policy
        if: github.event_name != 'push' || github.ref != 'refs/heads/codex/private-visual-regression-61'
        run: npm run visual:privacy

      - name: Compare private visual baselines
        if: github.event_name != 'push' || github.ref != 'refs/heads/codex/private-visual-regression-61'
        run: npm run visual:compare

      - name: Check deterministic workbench progress
        if: github.event_name != 'push' || github.ref != 'refs/heads/codex/private-visual-regression-61'
        run: npm run visual:progress:check

      - name: Verify deterministic static build
        if: github.event_name != 'push' || github.ref != 'refs/heads/codex/private-visual-regression-61'
        run: npm run workbench:verify-build
